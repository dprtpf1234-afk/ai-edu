<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI · 디지털 교육 자료</title>
  <meta name="description" content="AI·디지털 교육에 필요한 사이트와 수업 자료를 한곳에 모은 교사용 자료실" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">AI</span>AI · 디지털 교육 자료</a>
      <nav class="nav" id="nav" aria-label="주 메뉴"></nav>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" aria-label="자료 검색">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="drawer">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 모바일 메뉴 -->
  <div class="drawer" id="drawer" hidden>
    <nav class="drawer-nav" id="drawerNav" aria-label="모바일 메뉴"></nav>
  </div>

  <!-- 검색 -->
  <div class="search-layer" id="searchLayer" hidden>
    <div class="search-box" role="dialog" aria-modal="true" aria-label="자료 검색">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="사이트 이름이나 설명으로 검색 (예: 퀴즈, 데이터, 로봇)" autocomplete="off" />
        <button class="search-close" id="searchClose" aria-label="검색 닫기">ESC</button>
      </div>
      <ul class="search-results" id="searchResults"></ul>
    </div>
  </div>

  <section class="hero" id="hero">
    <div class="hero-map" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1 class="hero-title" id="heroTitle"></h1>
      <span class="hero-bar" aria-hidden="true"></span>
      <p class="hero-sub" id="heroSub"></p>
    </div>
  </section>

  <main id="main" class="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <span id="footerTitle"></span>
      <span class="footer-color"><i aria-hidden="true"></i>Color · PANTONE 11-4201 Cloud Dancer</span>
      <span>페이지 업데이트: <time id="footerUpdated"></time></span>
    </div>
  </footer>

  <button class="to-top" id="toTop" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- 파일을 고친 뒤 ?v= 숫자를 올리면 방문자 브라우저가 새 파일을 바로 받아옵니다 -->
  <script src="js/data.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
